plugins:
  resolvers:
    - https://github.com/{{index GroupParts 1}}/{{index GroupParts 2}}/releases/download/v{{Version}}/{{Product}}-{{Version}}-{{OS}}-{{Arch}}.tgz
  plugins:
    - locator:
        id: com.palantir.godel-mod-plugin:mod-plugin:1.63.0
        checksums:
          linux-amd64: a6a264ab05efa66e5fcc62046f2f7074db51931ffbde6c85ab28ab7f59d545c9
          linux-arm64: a700d83b2b4bf2e46c0c64e16b362cf796df53fdefd0567ebebed669712cb62e
environment:
  GO111MODULE: "on"
  GOFLAGS: "-mod=vendor"
exclude:
  names:
    - "\\..+"
    - "vendor"
  paths:
    - "godel"
